version: '3.8'

services:
  app:
    build: .
    container_name: mums-home-pos
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=pos_user
      - MYSQL_PASSWORD=pos_secure_password
      - MYSQL_DATABASE=mums_home_pos
      - GOOGLE_CLIENT_EMAIL=${GOOGLE_CLIENT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: mums-home-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password
      - MYSQL_DATABASE=mums_home_pos
      - MYSQL_USER=pos_user
      - MYSQL_PASSWORD=pos_secure_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
