# ============================================
# POSetRDV Super-Admin - Docker Compose
# Synchronisé sur la base de données de production
# ============================================

services:
  app:
    build: .
    container_name: posrdv-superadmin
    restart: always
    ports:
      - "4001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=posrdv-db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-pos_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-PosRdv2027!Secure}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mums_home_pos}
      - GOOGLE_CLIENT_EMAIL=${GOOGLE_CLIENT_EMAIL:-compteposrdv@posrdv.iam.gserviceaccount.com}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-issamo1555@gmail.com}
    volumes:
      - ./data-superadmin:/app/data
    networks:
      - default
      - mums_pos_net

networks:
  default:
  mums_pos_net:
    external: true
    name: mums-home-pos_default
